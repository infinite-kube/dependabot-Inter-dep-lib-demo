version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
    open-pull-requests-limit: 10
    labels: ["dependabot", "dependencies"]
    commit-message:
      prefix: "chore"
    rebase-strategy: "auto"

    groups:
      # Group major updates for core toolchain to prevent ERESOLVE conflicts.
      # These updates are typically non-trivial and should be reviewed together.
      major-toolchain-updates:
        update-types: [major]
        patterns:
          - "jest"
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "@babel/*"
          - "babel-*"
          - "webpack*"
          - "css-loader"
          - "style-loader"
          - "file-loader"
          - "url-loader"
      
      # Group minor and patch updates for all dependencies.
      # These are generally safe and can be automated to reduce noise.
      minor-and-patch-updates:
        update-types: [minor, patch]
        patterns:
          - "*"
        exclude-patterns:
          # Exclude the major toolchain packages to prevent conflicts
          # and ensure they are handled by the separate group above.
          - "jest"
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "@babel/*"
          - "babel-*"
          - "webpack*"
          - "css-loader"
          - "style-loader"
          - "file-loader"
          - "url-loader"
