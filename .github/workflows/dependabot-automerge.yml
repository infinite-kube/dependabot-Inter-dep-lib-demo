name: Dependabot Auto-Merge (Minor/Patch)
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v2
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Label majors for manual attention. This step is crucial for Scenario 3
      # as it "gates" breaking changes, preventing auto-merges for high-risk updates.
      - name: Label majors as needs-manual-review
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-major' }}
        run: gh pr edit ${{ github.event.pull_request.number }} --add-label "needs-manual-review"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Enable auto-merge for minor/patch. This step automates low-risk updates,
      # reducing manual overhead and PR noise, a key advantage of the solution.
      - name: Enable auto-merge for minor/patch
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch' }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash
